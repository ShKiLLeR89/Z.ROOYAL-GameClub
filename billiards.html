<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>بیلیارد ۸ | کلوپ بازی</title>
<link rel="icon" href="https://cdn.imgurl.ir/uploads/p440103_.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<style>
:root{
  --bg:#070d1c;--ink:#eef2ff;--mut:#9fb0d6;
  --gold:#f2c14e;--gold2:#ffe08a;--teal:#14b8a6;
  --card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);
  color-scheme:dark;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{overflow:hidden; height:100%; margin:0}
body{
  font-family:Vazirmatn,Tahoma,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 700px at 80% -10%,#21407a55,transparent 60%),
    radial-gradient(900px 600px at 0% 110%,#0f766e44,transparent 60%),var(--bg);
}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px}

/* header */
.site-header{position:fixed;top:0;left:0;right:0;z-index:50;backdrop-filter:blur(14px);
  background:linear-gradient(180deg,#070d1cf2,#070d1ccc 70%,transparent);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:16px;flex-shrink:0}
.brand img{width:32px;height:32px;border-radius:9px;object-fit:cover;box-shadow:0 6px 20px #000a;background:#0b1329}
.brand span{background:linear-gradient(180deg,#fff,#f2c14e);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav-links{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.nav-links a{padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600;color:var(--mut);transition:.2s}
.nav-links a:hover{background:var(--card);color:var(--ink)}
.nav-links a.active{background:#f2c14e1a;color:var(--gold2)}

#game{position:fixed;inset:0;display:block;touch-action:none;z-index:1}

/* HUD */
.hud{position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:40;
  display:flex;gap:12px;padding:8px 16px;border-radius:14px;
  background:#070d1ce6;border:1px solid var(--line);backdrop-filter:blur(8px);
  font-size:13px;font-weight:700;white-space:nowrap;max-width:96vw;overflow-x:auto;pointer-events:none}
.hud .item{display:flex;align-items:center;gap:6px}
.hud .dot{width:10px;height:10px;border-radius:50%}

.power-hud{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:40;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:10px 18px;border-radius:14px;background:#070d1ce6;border:1px solid var(--line);backdrop-filter:blur(8px);pointer-events:none}
.power-label{font-size:11px;color:var(--mut);font-weight:700}
.power-bar{width:220px;height:10px;border-radius:6px;background:#ffffff18;overflow:hidden;position:relative}
.power-fill{height:100%;width:0%;background:linear-gradient(90deg,#14b8a6,#f2c14e,#ff5d6c);transition:width .05s}
.power-text{font-size:12px;color:var(--gold2);font-weight:800;min-width:40px;text-align:center}

.hint{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:40;
  font-size:12px;color:var(--mut);background:#070d1cd9;padding:6px 14px;border-radius:10px;
  border:1px solid var(--line);text-align:center;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none}

/* Overlay */
.ov{position:fixed;inset:0;display:grid;place-items:center;background:#050a16f2;backdrop-filter:blur(12px);z-index:100;padding:16px;overflow:auto}
.ov[hidden]{display:none}
.box{width:min(440px,100%);text-align:center;padding:24px 20px;border-radius:22px;
  background:linear-gradient(160deg,#1a2c52,#0d1730);border:1px solid var(--line);
  box-shadow:0 30px 80px #000;animation:boxIn .35s ease}
@keyframes boxIn{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.box h2{margin:0 0 6px;font-size:22px;font-weight:900}
.box p{margin:0 0 16px;color:var(--mut);font-size:13px;line-height:1.9}
.opt-group{margin:12px 0}
.opt-label{font-size:12px;color:var(--mut);margin-bottom:6px;font-weight:600}
.mode,.diff{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.diff{grid-template-columns:repeat(3,1fr)}
.mode button,.diff button{padding:10px 6px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13px;transition:.2s}
.mode button:hover,.diff button:hover{background:rgba(255,255,255,.12)}
.mode button[aria-pressed=true],.diff button[aria-pressed=true]{background:linear-gradient(180deg,#ffe08a,#f2b434);color:#2a1b02;border-color:transparent}
.btn-gold{width:100%;padding:13px;border-radius:13px;font-weight:800;font-size:15px;color:#2a1b02;
  background:linear-gradient(180deg,#ffe08a,#f2b434);box-shadow:0 7px 0 #9a6a10;transition:transform .1s;margin-top:8px}
.btn-gold:active{transform:translateY(4px);box-shadow:0 3px 0 #9a6a10}
.btn-ghost{padding:9px 14px;border-radius:11px;font-weight:600;background:var(--card);border:1px solid var(--line);transition:.2s;width:100%;margin-top:8px;font-size:13px}
.btn-ghost:hover{background:rgba(255,255,255,.12)}
.room-code{font-size:28px;font-weight:900;letter-spacing:8px;color:var(--gold2);font-family:monospace;margin:8px 0}
.status{font-size:12px;color:var(--mut);margin:8px 0;min-height:16px}
.status.ok{color:#7cf2e3}

@media(max-width:600px){
  .nav-links{display:none}
  .hud{font-size:11px;gap:8px;padding:6px 10px;top:50px}
  .power-bar{width:160px}
  .power-hud{bottom:10px;padding:8px 12px}
  .hint{bottom:80px;font-size:11px}
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<header class="site-header">
  <div class="wrap nav">
    <a href="index.html" class="brand">
      <img src="https://cdn.imgurl.ir/uploads/p440103_.png" alt="کلوپ بازی">
      <span>کلوپ بازی</span>
    </a>
    <nav class="nav-links">
      <a href="index.html#games">بازی‌ها</a>
      <a href="billiards.html" class="active">بیلیارد</a>
      <a href="learn.html">آموزش‌ها</a>
    </nav>
  </div>
</header>

<div class="hud" id="hud">
  <div class="item"><span class="dot" style="background:#3fc1ff"></span><b>شما</b></div>
  <div class="item" id="hudGroup1">—</div>
  <div class="item" style="color:var(--mut)">|</div>
  <div class="item"><span class="dot" style="background:#ff5d6c"></span><b>حریف</b></div>
  <div class="item" id="hudGroup2">—</div>
  <div class="item" style="color:var(--gold2);font-weight:900" id="hudTurn">نوبت شما</div>
</div>

<div class="power-hud" id="powerHud">
  <div class="power-label">قدرت ضربه — برای شوت بکش</div>
  <div class="power-bar"><div class="power-fill" id="powerFill"></div></div>
  <div class="power-text" id="powerText">0%</div>
</div>

<div class="hint" id="hint">برای شوت، از پایین بکش و رها کن</div>

<div class="ov" id="start">
  <div class="box">
    <h2>🎱 بیلیارد ۸</h2>
    <p>حالت بازی و سطح حریف را انتخاب کن</p>
    <div class="opt-group">
      <div class="opt-label">حالت بازی</div>
      <div class="mode" id="mode">
        <button data-mode="ai" aria-pressed="true">🤖 با رایانه</button>
        <button data-mode="lan" aria-pressed="false">📡 لن</button>
      </div>
    </div>
    <div class="opt-group" id="diffWrap">
      <div class="opt-label">سطح هوش مصنوعی</div>
      <div class="diff" id="diff">
        <button data-d="easy" aria-pressed="true">آسان</button>
        <button data-d="med" aria-pressed="false">متوسط</button>
        <button data-d="hard" aria-pressed="false">سخت</button>
      </div>
    </div>
    <button id="begin" class="btn-gold">شروع بازی</button>
  </div>
</div>

<div class="ov" id="lanOv" hidden>
  <div class="box">
    <h2>📡 بیلیارد لن</h2>
    <p id="lanStatus">در حال آماده‌سازی…</p>
    <div class="room-code" id="lanCode">------</div>
    <button class="btn-gold" id="lanReadyBtn" disabled>شروع بازی</button>
    <button class="btn-ghost" id="lanCloseBtn" style="margin-top:8px">انصراف</button>
  </div>
</div>

<div class="ov" id="end" hidden>
  <div class="box">
    <h2 id="endTitle">🏆 برنده!</h2>
    <p id="endMsg"></p>
    <button id="endAgain" class="btn-gold">بازی دوباره</button>
  </div>
</div>

<script>
/* ======================================================
   LAN CLIENT
====================================================== */
const LanClient = (() => {
  let peer = null, conn = null;
  let roomCode = null, role = null;
  let isConnected = false;
  let onMsg = null, onConn = null, onDisc = null;
  function getParams(){
    const p = new URLSearchParams(location.search);
    return { lan: p.get('lan'), role: p.get('role') };
  }
  function isLanMode(){ const p = getParams(); return !!(p.lan && p.role); }
  function init(){
    const p = getParams();
    if(!p.lan || !p.role) return false;
    roomCode = p.lan; role = p.role;
    if(role === 'host'){
      peer = new Peer('klub-bill-' + roomCode, { debug: 1 });
      peer.on('open', () => { if(onConn) onConn('waiting'); });
      peer.on('connection', (c) => {
        conn = c;
        conn.on('open', () => { isConnected = true; if(onConn) onConn('connected'); });
        conn.on('data', (d) => { if(onMsg) onMsg(d); });
        conn.on('close', () => { isConnected = false; if(onDisc) onDisc(); });
      });
      peer.on('error', (e) => console.error('[LAN host]', e));
    } else {
      peer = new Peer({ debug: 1 });
      peer.on('open', () => {
        conn = peer.connect('klub-bill-' + roomCode, { reliable: true });
        conn.on('open', () => { isConnected = true; if(onConn) onConn('connected'); });
        conn.on('data', (d) => { if(onMsg) onMsg(d); });
        conn.on('close', () => { isConnected = false; if(onDisc) onDisc(); });
        conn.on('error', (e) => console.error('[LAN guest]', e));
      });
      peer.on('error', (e) => console.error('[LAN guest]', e));
    }
    return true;
  }
  function send(data){ if(conn && conn.open){ conn.send(data); return true; } return false; }
  return {
    isLanMode, init, send,
    onMessage: (cb) => onMsg = cb,
    onConnected: (cb) => onConn = cb,
    onDisconnected: (cb) => onDisc = cb,
    getInfo: () => ({ roomCode, role, isConnected })
  };
})();

/* ======================================================
   THREE.JS SETUP
====================================================== */
const $ = s => document.querySelector(s);
const fa = n => Number(n).toLocaleString('fa-IR');

const canvas = $('#game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.setClearColor(0x0a0a12, 1); // رنگ پس‌زمینه (کمی روشن‌تر از مشکی)

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);

// دوربین ثابت و رو به میز (مثل عکس)
camera.position.set(0, 8.5, 5.5);
camera.lookAt(0, 0, 0);

/* ======================================================
   ابعاد میز (متناسب با عکس)
====================================================== */
// میز ۸ در ۴
const TABLE_W = 10;
const TABLE_H = 5;
const RAIL = 0.5;
const BALL_R = 0.16;
const POCKET_R = 0.25;
const PLAY_W = TABLE_W - 2*RAIL;
const PLAY_H = TABLE_H - 2*RAIL;

/* ======================================================
   🎨 بافت میز (دقیقاً عکس فرستاده شده)
====================================================== */
// ⚠️ لینک عکسی که فرستادی
const TABLE_IMAGE = 'https://cdn.imgurl.ir/uploads/m897528_.png'; 

const textureLoader = new THREE.TextureLoader();
const boardTexture = textureLoader.load(TABLE_IMAGE);
boardTexture.colorSpace = THREE.SRGBColorSpace;
boardTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();

// ساخت میز با بافت
const boardGeo = new THREE.PlaneGeometry(TABLE_W, TABLE_H);
const boardMat = new THREE.MeshStandardMaterial({ map: boardTexture, roughness: 0.5 });
const boardMesh = new THREE.Mesh(boardGeo, boardMat);
boardMesh.rotation.x = -Math.PI/2;
boardMesh.position.y = 0.01;
scene.add(boardMesh);

// تشک زیر میز (برای اینکه بافت حالت سه‌بعدی بگیره)
const baseGeo = new THREE.BoxGeometry(TABLE_W + 0.2, 0.3, TABLE_H + 0.2);
const baseMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9 });
const base = new THREE.Mesh(baseGeo, baseMat);
base.position.y = -0.16;
base.receiveShadow = true;
scene.add(base);

// دیواره‌ها (برای فیزیک)
const railMat = new THREE.MeshStandardMaterial({ color: 0x3a1e0a, roughness: 0.7 });
// بالا و پایین
[-1, 1].forEach(side => {
  const rail = new THREE.Mesh(new THREE.BoxGeometry(TABLE_W, 0.2, RAIL), railMat);
  rail.position.set(0, 0.1, side * (TABLE_H/2 - RAIL/2));
  rail.castShadow = true; rail.receiveShadow = true;
  scene.add(rail);
});
// چپ و راست
[-1, 1].forEach(side => {
  const rail = new THREE.Mesh(new THREE.BoxGeometry(RAIL, 0.2, TABLE_H - 2*RAIL), railMat);
  rail.position.set(side * (TABLE_W/2 - RAIL/2), 0.1, 0);
  rail.castShadow = true; rail.receiveShadow = true;
  scene.add(rail);
});

/* ======================================================
   Pocket
====================================================== */
const POCKETS = [
  [-TABLE_W/2 + RAIL, -TABLE_H/2 + RAIL],
  [0, -TABLE_H/2 + RAIL],
  [TABLE_W/2 - RAIL, -TABLE_H/2 + RAIL],
  [-TABLE_W/2 + RAIL, TABLE_H/2 - RAIL],
  [0, TABLE_H/2 - RAIL],
  [TABLE_W/2 - RAIL, TABLE_H/2 - RAIL]
];

// سوراخ‌ها (دایره سیاه)
POCKETS.forEach(([x, z]) => {
  const geo = new THREE.CircleGeometry(POCKET_R, 20);
  const mat = new THREE.MeshBasicMaterial({ color: 0x000000 });
  const m = new THREE.Mesh(geo, mat);
  m.rotation.x = -Math.PI/2;
  m.position.set(x, 0.02, z);
  scene.add(m);
});

/* ======================================================
   نورپردازی
====================================================== */
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
dirLight.position.set(5, 10, 7);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(1024, 1024);
scene.add(dirLight);

/* ======================================================
   توپ‌ها
====================================================== */
const BALL_COLORS = {
  0: 0xffffff,
  1: 0xf2c14e, 2: 0x1e40af, 3: 0xdc2626, 4: 0x7c3aed,
  5: 0xf59e0b, 6: 0x065f46, 7: 0x991b1b, 8: 0x111111,
  9: 0xf2c14e, 10: 0x1e40af, 11: 0xdc2626, 12: 0x7c3aed,
  13: 0xf59e0b, 14: 0x065f46, 15: 0x991b1b
};
const STRIPES = new Set([9,10,11,12,13,14,15]);

let balls = [];
let cueBall = null;

function createBall(id, x, z){
  const group = new THREE.Group();
  const geo = new THREE.SphereGeometry(BALL_R, 24, 16);
  const color = BALL_COLORS[id];
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.3, metalness: 0.1 });
  const sphere = new THREE.Mesh(geo, mat);
  sphere.castShadow = true;
  sphere.receiveShadow = true;
  group.add(sphere);

  if(STRIPES.has(id)){
    const bandGeo = new THREE.CylinderGeometry(BALL_R*1.01, BALL_R*1.01, BALL_R*0.75, 24, 1, true);
    const bandMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5, side: THREE.DoubleSide });
    const band = new THREE.Mesh(bandGeo, bandMat);
    group.add(band);
  }

  if(id > 0){
    const cGeo = new THREE.CircleGeometry(BALL_R*0.42, 20);
    const cMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const c = new THREE.Mesh(cGeo, cMat);
    c.position.set(0, BALL_R*0.9, 0);
    c.rotation.x = -Math.PI/2;
    group.add(c);
  }

  group.position.set(x, BALL_R, z);
  scene.add(group);
  return group;
}

function resetBalls(){
  balls.forEach(b => scene.remove(b.mesh));
  balls.length = 0;

  // توپ سفید (cue)
  const cue = createBall(0, -PLAY_W/3, 0);
  cueBall = { mesh: cue, id: 0, vx: 0, vz: 0, alive: true };
  balls.push(cueBall);

  // چیدمان مثلث
  const startX = PLAY_W/3;
  const gap = BALL_R * 2.05;
  const rackPositions = [];
  for(let row=0; row<5; row++){
    for(let col=0; col<=row; col++){
      const x = startX + row * gap * Math.sqrt(3)/2;
      const z = (col - row/2) * gap;
      rackPositions.push([x, z]);
    }
  }
  const arr = [1, 9, 2, 10, 3, 11, 4, 12, 5, 13, 6, 14, 7, 15, 8];
  rackPositions.forEach(([x,z], i) => {
    const ballId = arr[i];
    const mesh = createBall(ballId, x, z);
    balls.push({ mesh, id: ballId, vx: 0, vz: 0, alive: true });
  });
}

resetBalls();

/* ======================================================
   🎱 چوب بیلیارد (با لرزش هنگام قدرت)
====================================================== */
const cueGroup = new THREE.Group();
const cueLength = 2.5;
const cueGeo = new THREE.CylinderGeometry(0.02, 0.06, cueLength, 12);
const cueMat = new THREE.MeshStandardMaterial({ color: 0xc68b4b, roughness: 0.6 });
const cueStick = new THREE.Mesh(cueGeo, cueMat);
cueStick.rotation.z = Math.PI/2;
cueStick.position.x = -cueLength/2;
cueStick.castShadow = true;
cueGroup.add(cueStick);

const tipGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.1, 12);
const tipMat = new THREE.MeshStandardMaterial({ color: 0x3fc1ff });
const tip = new THREE.Mesh(tipGeo, tipMat);
tip.rotation.z = Math.PI/2;
tip.position.x = -cueLength + 0.05;
cueGroup.add(tip);

cueGroup.visible = false;
scene.add(cueGroup);

/* ======================================================
   هدف‌گیری و شوت
====================================================== */
let aimAngle = 0;
let power = 0;
let shooting = false;

function updateCuePosition(){
  if(!cueBall || !cueBall.alive) return;
  const cuePos = cueBall.mesh.position;
  
  // چوب پشت توپ سفید، در جهت مخالف هدف
  const dist = 0.5 + power * 0.5; // با زیاد شدن قدرت، چوب عقب‌تر می‌ره
  cueGroup.position.set(
    cuePos.x - Math.sin(aimAngle) * dist, 
    0.16, 
    cuePos.z - Math.cos(aimAngle) * dist
  );
  cueGroup.rotation.y = aimAngle;
  cueGroup.visible = true;
}

/* ======================================================
   فیزیک
====================================================== */
const FRICTION = 0.985;
const WALL_BOUNCE = 0.85;
const BALL_BOUNCE = 0.95;
const MIN_SPEED = 0.04;

let currentPlayer = 0;
let myPlayer = 0;
let playerGroups = [null, null];
let gameOver = false;
let aiMode = false, aiLevel = 'easy';
let lanMode = false, lanConnected = false, lanRole = null;

function stepPhysics(dt){
  if(!shooting) return;
  let anyMoving = false;

  for(const b of balls){
    if(!b.alive) continue;
    if(Math.abs(b.vx) < MIN_SPEED && Math.abs(b.vz) < MIN_SPEED){
      b.vx = 0; b.vz = 0;
      continue;
    }
    anyMoving = true;
    b.mesh.position.x += b.vx * dt;
    b.mesh.position.z += b.vz * dt;
    b.vx *= FRICTION;
    b.vz *= FRICTION;
  }

  // برخورد توپ-توپ
  for(let i=0;i<balls.length;i++){
    const a = balls[i];
    if(!a.alive) continue;
    for(let j=i+1;j<balls.length;j++){
      const b = balls[j];
      if(!b.alive) continue;
      const dx = b.mesh.position.x - a.mesh.position.x;
      const dz = b.mesh.position.z - a.mesh.position.z;
      const dist = Math.hypot(dx, dz);
      const minD = BALL_R * 2;
      if(dist < minD && dist > 0.001){
        const nx = dx / dist;
        const nz = dz / dist;
        const overlap = minD - dist;
        a.mesh.position.x -= nx * overlap/2;
        a.mesh.position.z -= nz * overlap/2;
        b.mesh.position.x += nx * overlap/2;
        b.mesh.position.z += nz * overlap/2;
        const va = a.vx * nx + a.vz * nz;
        const vb = b.vx * nx + b.vz * nz;
        if(va - vb > 0){
          const imp = (va - vb) * BALL_BOUNCE;
          a.vx -= imp * nx;
          a.vz -= imp * nz;
          b.vx += imp * nx;
          b.vz += imp * nz;
        }
      }
    }
  }

  // دیواره‌ها
  const xMin = -PLAY_W/2 + BALL_R;
  const xMax =  PLAY_W/2 - BALL_R;
  const zMin = -PLAY_H/2 + BALL_R;
  const zMax =  PLAY_H/2 - BALL_R;
  
  for(const b of balls){
    if(!b.alive) continue;
    const p = b.mesh.position;
    if(p.x < xMin){ p.x = xMin; b.vx = -b.vx * WALL_BOUNCE; }
    if(p.x > xMax){ p.x = xMax; b.vx = -b.vx * WALL_BOUNCE; }
    if(p.z < zMin){ p.z = zMin; b.vz = -b.vz * WALL_BOUNCE; }
    if(p.z > zMax){ p.z = zMax; b.vz = -b.vz * WALL_BOUNCE; }
  }

  // pocket
  for(const b of balls){
    if(!b.alive) continue;
    const p = b.mesh.position;
    for(const [px, pz] of POCKETS){
      const d = Math.hypot(p.x - px, p.z - pz);
      if(d < POCKET_R * 0.9){
        b.alive = false;
        scene.remove(b.mesh);
        handlePocket(b);
        break;
      }
    }
  }

  if(!anyMoving){
    shooting = false;
    endTurn();
  }
}

function handlePocket(ball){
  if(ball.id === 0){
    setTimeout(() => {
      ball.alive = true;
      ball.mesh = createBall(0, -PLAY_W/3, 0);
      scene.add(ball.mesh);
      ball.vx = 0; ball.vz = 0;
    }, 800);
    return;
  }
  if(ball.id === 8){
    gameOver = true;
    $('#endTitle').textContent = '🏆 بردی!';
    $('#endMsg').textContent = 'توپ ۸ رو زدی و بردی!';
    $('#end').hidden = false;
    return;
  }
  if(playerGroups[0] === null){
    const g = ball.id < 8 ? 'solid' : 'stripe';
    playerGroups[myPlayer] = g;
    playerGroups[1 - myPlayer] = g === 'solid' ? 'stripe' : 'solid';
    updateHud();
  }
}

function endTurn(){
  currentPlayer = 1 - currentPlayer;
  updateHud();
  if(!gameOver){
    if(aiMode && currentPlayer === 1){
      setTimeout(aiShoot, 800);
    } else if(lanMode && currentPlayer !== myPlayer){
      $('#hint').textContent = 'منتظر حرکت حریف…';
    } else {
      $('#hint').textContent = 'برای شوت، از پایین بکش و رها کن';
    }
  }
  if(lanMode && lanConnected){
    LanClient.send({ type:'turn', player: currentPlayer });
  }
}

function updateHud(){
  const names = { solid: 'توپر (1-7)', stripe: 'راه‌راه (9-15)' };
  $('#hudGroup1').textContent = playerGroups[0] ? names[playerGroups[0]] : '—';
  $('#hudGroup2').textContent = playerGroups[1] ? names[playerGroups[1]] : '—';
  $('#hudTurn').textContent = gameOver ? 'پایان' : (currentPlayer === myPlayer ? 'نوبت شما' : 'نوبت حریف');
  $('#hudTurn').style.color = currentPlayer === myPlayer ? '#7cf2e3' : '#ff8a9a';
}

/* ======================================================
   شوت
====================================================== */
function shoot(p){
  if(!cueBall || !cueBall.alive) return;
  if(gameOver) return;
  
  const speed = 16 * p;
  cueBall.vx = Math.sin(aimAngle) * speed;
  cueBall.vz = Math.cos(aimAngle) * speed;
  shooting = true;
  
  cueGroup.visible = false;
  $('#hint').textContent = 'در حال حرکت…';
  
  if(lanMode && lanConnected){
    LanClient.send({ type:'shoot', vx: cueBall.vx, vz: cueBall.vz });
  }
}

/* ======================================================
   کنترل با موس
====================================================== */
let isDragging = false;
let dragStartX = 0;
let dragStartY = 0;

canvas.addEventListener('pointerdown', e => {
  if(gameOver || shooting) return;
  isDragging = true;
  dragStartX = e.clientX;
  dragStartY = e.clientY;
});

canvas.addEventListener('pointermove', e => {
  if(gameOver || shooting) return;
  
  if(isDragging){
    // کشیدن برای شوت
    const dy = e.clientY - dragStartY;
    if(dy > 0){
      power = Math.min(1, dy / 150);
      $('#powerFill').style.width = (power * 100) + '%';
      $('#powerText').textContent = Math.round(power * 100) + '%';
    } else {
      // کشیدن به بالا = چرخش دوربین
      const dx = e.clientX - dragStartX;
      aimAngle = dx * 0.01;
      updateCuePosition();
    }
  } else {
    // فقط حرکت موس = تغییر جهت
    const rect = canvas.getBoundingClientRect();
    const mouseX = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    const mouseY = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    
    // محاسبه زاویه
    aimAngle = Math.atan2(mouseX, mouseY);
    updateCuePosition();
  }
});

canvas.addEventListener('pointerup', e => {
  if(!isDragging) return;
  isDragging = false;
  
  if(power > 0.05){
    shoot(power);
  }
  
  power = 0;
  $('#powerFill').style.width = '0%';
  $('#powerText').textContent = '0%';
  updateCuePosition();
});

/* ======================================================
   AI
====================================================== */
function aiShoot(){
  if(gameOver || currentPlayer !== 1) return;
  
  const myGroup = playerGroups[1];
  const targets = balls.filter(b => b.alive && (myGroup ? (b.id < 8 ? 'solid' : 'stripe') === myGroup : (b.id !== 0 && b.id !== 8)));
  
  if(targets.length === 0) return;
  
  let best = targets[0], bestD = Infinity;
  for(const t of targets){
    const d = Math.hypot(t.mesh.position.x - cueBall.mesh.position.x, t.mesh.position.z - cueBall.mesh.position.z);
    if(d < bestD){ bestD = d; best = t; }
  }
  
  // زاویه
  const dx = best.mesh.position.x - cueBall.mesh.position.x;
  const dz = best.mesh.position.z - cueBall.mesh.position.z;
  aimAngle = Math.atan2(dx, dz);
  updateCuePosition();
  
  let p = 0.7;
  if(aiLevel === 'easy') p = 0.5 + Math.random() * 0.3;
  else if(aiLevel === 'med') p = 0.65 + Math.random() * 0.25;
  else p = 0.8 + Math.random() * 0.15;
  
  setTimeout(() => shoot(p), 300);
}

/* ======================================================
   LAN
====================================================== */
function startLanMode(){
  lanMode = true;
  $('#start').hidden = true;
  $('#lanOv').hidden = false;

  const info = LanClient.getInfo();
  const code = info.roomCode || new URLSearchParams(location.search).get('lan');
  const role = info.role || new URLSearchParams(location.search).get('role');

  if(!code || !role){
    $('#lanStatus').textContent = '⚠️ کد اتاق یا نقش پیدا نشد.';
    return;
  }

  lanRole = role;
  myPlayer = role === 'host' ? 0 : 1;

  $('#lanCode').textContent = code;
  $('#lanStatus').textContent = role === 'host' ? 'در حال ساخت اتاق…' : 'در حال اتصال…';

  LanClient.onConnected((status) => {
    if(status === 'connected'){
      lanConnected = true;
      $('#lanStatus').textContent = '✅ حریف وصل شد!';
      $('#lanStatus').classList.add('ok');
      $('#lanReadyBtn').disabled = false;
    } else if(status === 'waiting'){
      $('#lanStatus').textContent = '✅ اتاق آماده‌ست.';
    }
  });

  LanClient.onDisconnected(() => {
    lanConnected = false;
    $('#lanStatus').textContent = '⚠️ اتصال قطع شد';
    $('#lanReadyBtn').disabled = true;
  });

  LanClient.onMessage((data) => {
    if(data.type === 'shoot'){
      cueBall.vx = data.vx;
      cueBall.vz = data.vz;
      shooting = true;
      cueGroup.visible = false;
    }
    if(data.type === 'turn'){
      currentPlayer = data.player;
      updateHud();
    }
  });

  LanClient.init();
}

$('#lanReadyBtn').onclick = () => {
  $('#lanOv').hidden = true;
  startGame();
};

$('#lanCloseBtn').onclick = () => {
  location.href = 'lan.html';
};

/* ======================================================
   start
====================================================== */
function startGame(){
  resetBalls();
  currentPlayer = 0;
  myPlayer = 0;
  playerGroups = [null, null];
  gameOver = false;
  shooting = false;
  power = 0;
  aimAngle = 0;
  updateCuePosition();
  updateHud();
  $('#hint').textContent = 'حرکت موس رو تغییر بده و برای شوت بکش';
  $('#end').hidden = true;
}

/* ======================================================
   render loop
====================================================== */
function animate(){
  stepPhysics(0.1);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

/* ======================================================
   resize
====================================================== */
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

/* ======================================================
   events
====================================================== */
$('#mode').onclick = e => {
  const b = e.target.closest('button'); if(!b) return;
  [...$('#mode').children].forEach(x => x.setAttribute('aria-pressed', x === b));
  $('#diffWrap').style.display = b.dataset.mode === 'ai' ? 'block' : 'none';
};

$('#diff').onclick = e => {
  const b = e.target.closest('button'); if(!b) return;
  [...$('#diff').children].forEach(x => x.setAttribute('aria-pressed', x === b));
  aiLevel = b.dataset.d;
};

$('#begin').onclick = () => {
  const m = $('#mode button[aria-pressed=true]').dataset.mode;
  if(m === 'lan'){
    startLanMode();
    return;
  }
  aiMode = m === 'ai';
  $('#start').hidden = true;
  startGame();
};

$('#endAgain').onclick = () => {
  $('#end').hidden = true;
  $('#start').hidden = false;
};

/* ======================================================
   boot
====================================================== */
if(LanClient.isLanMode()){
  $('#start').hidden = true;
  startLanMode();
}
</script>
